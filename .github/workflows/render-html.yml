name: Render HTML and PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-html.yml"
      - "_quarto.yml"
      - "index.qmd"
      - "sections/**"
      - "filters/**"
      - "styles/**"
      - "styles.css"
      - "macros.tex"
      - "mathjax-macros.html"
      - "references.bib"
      - "scripts/sync-macros.py"
      - "tex/**"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Enable LaTeX package auto-install in CI
        run: sed -i 's/latex-auto-install: false/latex-auto-install: true/' _quarto.yml

      - name: Render HTML
        run: quarto render index.qmd --to html

      - name: Render PDF
        run: quarto render index.qmd --to pdf

      - name: Commit rendered outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore _quarto.yml
          git add -f _output/index.html _output/index_files _output/styles.css _output/index.pdf
          git rm -f --ignore-unmatch _output/pdf-build.log || true
          if git diff --cached --quiet; then
            echo "Rendered outputs are unchanged."
          else
            git commit -m "docs: render HTML and PDF [skip ci]"
            git push
          fi
